<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mermaid Visual Editor</title>
<style>
:root {
  --paper: #eef1f5;
  --dot: #c5ccd6;
  --panel: #ffffff;
  --ink: #17202b;
  --ink-2: #566272;
  --ink-3: #8691a0;
  --line: #d6dbe2;
  --line-2: #e7eaef;
  --accent: #cf1c6b;
  --accent-soft: #fbe4ef;
  --err: #b3261e;
  --err-soft: #fdecea;
  --code-bg: #fbfcfd;
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", "Noto Sans", sans-serif;
  --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 13px/1.45 var(--sans); color: var(--ink); background: var(--panel); display: flex; flex-direction: column; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---- top bar ---- */
#bar { display: flex; align-items: center; gap: 14px; padding: 7px 12px; border-bottom: 1px solid var(--line); flex: none; }
#doc { display: flex; align-items: baseline; gap: 6px; min-width: 0; margin-right: auto; }
#fname { font-weight: 650; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 32vw; }
#dirty { color: var(--accent); font-size: 12px; visibility: hidden; }
#dirty.on { visibility: visible; }
#dtype { color: var(--ink-3); font-size: 12px; white-space: nowrap; }
.grp { display: flex; gap: 4px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 5px; padding: 4px 10px; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--ink-3); }
.btn:disabled { color: var(--ink-3); cursor: default; }
.btn.solid { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn.solid:hover { background: #2a3644; }
.btn.danger { color: var(--err); }
.menu { position: relative; }
.menu-list { position: absolute; top: calc(100% + 4px); left: 0; z-index: 30; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 24px rgba(23, 32, 43, .14); padding: 4px; min-width: 190px; display: none; }
.menu.open .menu-list { display: block; }
.menu-list button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 6px 10px; border-radius: 4px; }
.menu-list button:hover { background: var(--paper); }

/* ---- workspace ---- */
#work { flex: 1; display: flex; min-height: 0; }
#code { width: 340px; min-width: 180px; display: flex; flex-direction: column; background: var(--code-bg); flex: none; }
#code.hidden { display: none; }
#code.hidden + #split { display: none; }
#edwrap { flex: 1; display: flex; min-height: 0; position: relative; }
#gutter { width: 38px; padding: 10px 6px 10px 0; text-align: right; color: var(--ink-3); font: 12px/1.6 var(--mono); overflow: hidden; user-select: none; white-space: pre; border-right: 1px solid var(--line-2); flex: none; }
#gutter .bad { color: #fff; background: var(--err); border-radius: 3px; padding: 0 3px; margin-right: -3px; }
#src { flex: 1; border: 0; resize: none; padding: 10px 12px; font: 12px/1.6 var(--mono); background: transparent; white-space: pre; overflow: auto; tab-size: 4; min-width: 0; }
#src:focus { outline: none; }
#status { flex: none; padding: 7px 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-2); min-height: 32px; white-space: pre-wrap; max-height: 30%; overflow: auto; }
#status.err { color: var(--err); background: var(--err-soft); font-family: var(--mono); font-size: 11.5px; }
#split { width: 5px; cursor: col-resize; background: var(--line); flex: none; }
#split:hover, #split.drag { background: var(--accent); }

#canvas { flex: 1; position: relative; overflow: hidden; min-width: 0; touch-action: none; cursor: grab;
  background-color: var(--paper); background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 20px 20px; }
#canvas.dark { background-color: #1e1e1e; background-image: radial-gradient(#3a3d42 1px, transparent 1.2px); }
#canvas.panning { cursor: grabbing; }
#sheet { position: absolute; left: 0; top: 0; transform-origin: 0 0; user-select: none; -webkit-user-select: none; }
#sheet.stale { opacity: .45; }
#sheet svg { display: block; overflow: visible; }
#sheet.editable g.node, #sheet.editable g.cluster, #sheet.editable g.edgeLabel, #sheet.editable .m-hit { cursor: pointer; }
#sheet .m-hit { fill: none; stroke: transparent; stroke-width: 16px; pointer-events: stroke; }
#sheet .m-sel { filter: drop-shadow(0 0 1.5px var(--accent)) drop-shadow(0 0 1.5px var(--accent)) drop-shadow(0 0 3px var(--accent)); }
#sheet path.m-sel { stroke: var(--accent) !important; }
#sheet g.node.m-target { filter: drop-shadow(0 0 2px var(--accent)) drop-shadow(0 0 5px var(--accent)); }

#tools { position: absolute; left: 12px; top: 12px; display: flex; gap: 6px; z-index: 5; }
#tools .btn, #zoom .btn { box-shadow: 0 1px 3px rgba(23, 32, 43, .1); }
#zoom { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 4px; z-index: 5; }
#zoom .btn { min-width: 30px; padding: 4px 8px; }
#note { position: absolute; left: 12px; bottom: 12px; max-width: min(520px, calc(100% - 200px)); background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 5px; padding: 7px 10px; font-size: 12px; color: var(--ink-2); z-index: 5; display: none; }
#note.on { display: block; }
#empty { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: var(--ink-2); text-align: center; padding: 24px; pointer-events: none; }
#empty.on { display: flex; }
.handle { position: absolute; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: #fff; border: 2px solid #fff; z-index: 6; cursor: crosshair; display: none; font: 700 14px/15px var(--sans); text-align: center; padding: 0; box-shadow: 0 1px 4px rgba(23, 32, 43, .3); touch-action: none; }
.handle.on { display: block; }
#rubber { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 7; display: none; }
#rubber.on { display: block; }
#rubber line { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 4; }
#inline { position: absolute; z-index: 8; display: none; border: 2px solid var(--accent); border-radius: 5px; padding: 6px 8px; font: 14px/1.4 var(--sans); background: #fff; color: var(--ink); resize: none; box-shadow: 0 6px 20px rgba(23, 32, 43, .2); text-align: center; }
#inline.on { display: block; }
#toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 7px 14px; border-radius: 5px; font-size: 12.5px; z-index: 20; display: none; max-width: 80%; }
#toast.on { display: block; }
#toast.bad { background: var(--err); }

/* ---- inspector ---- */
#insp { width: 272px; border-left: 1px solid var(--line); padding: 14px 14px 20px; overflow: auto; flex: none; }
#insp h2 { font-size: 14px; margin: 0 0 2px; font-weight: 650; }
#insp .sub { color: var(--ink-3); font-size: 12px; margin: 0 0 12px; word-break: break-all; }
.field { margin: 0 0 12px; }
.field > label, .field > .lab { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
.field input[type=text], .field input[type=number], .field select, .field textarea { width: 100%; border: 1px solid var(--line); border-radius: 5px; padding: 5px 7px; background: #fff; }
.field textarea { resize: vertical; min-height: 54px; font-family: var(--sans); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.seg button { flex: 1; border: 0; border-right: 1px solid var(--line); background: #fff; padding: 5px 4px; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--ink); color: #fff; }
.shapes { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.shapes button { border: 1px solid var(--line); background: #fff; border-radius: 4px; padding: 3px 0 1px; }
.shapes button svg { width: 26px; height: 16px; fill: none; stroke: var(--ink-2); stroke-width: 1.4; }
.shapes button.on { border-color: var(--accent); background: var(--accent-soft); }
.shapes button.on svg { stroke: var(--accent); }
.colors { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.color { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--ink-2); }
.color .row { display: flex; gap: 3px; align-items: center; }
.color input[type=color] { width: 100%; height: 26px; padding: 1px; border: 1px solid var(--line); border-radius: 4px; background: #fff; cursor: pointer; }
.color input.unset { opacity: .35; }
.color .x { border: 0; background: none; color: var(--ink-3); padding: 0 2px; font-size: 14px; line-height: 1; }
.color .x:hover { color: var(--err); }
.check { display: flex; align-items: center; gap: 6px; font-size: 12.5px; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line-2); }
.tips { color: var(--ink-2); font-size: 12.5px; margin: 14px 0 0; padding: 12px 0 0; border-top: 1px solid var(--line-2); }
.tips dt { font-weight: 600; color: var(--ink); margin-top: 7px; }
.tips dd { margin: 0; }
kbd { font: 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; background: #fff; }

@media (max-width: 900px) {
  #work { flex-direction: column; }
  #code { width: auto !important; height: 34%; order: 3; border-top: 1px solid var(--line); }
  #split { display: none; }
  #insp { width: auto; max-height: 30%; border-left: 0; border-top: 1px solid var(--line); order: 2; }
  #bar { flex-wrap: wrap; gap: 6px; }
}
</style>
</head>
<body>
<header id="bar">
  <div id="doc"><span id="fname">untitled.mmd</span><span id="dirty" title="Unsaved changes">●</span><span id="dtype"></span></div>
  <div class="grp">
    <div class="menu" id="newmenu"><button class="btn" id="bnew" aria-haspopup="true">New</button><div class="menu-list" id="newlist"></div></div>
    <button class="btn" id="bopen" title="Open a .mmd file (Ctrl+O)">Open</button>
    <button class="btn solid" id="bsave" title="Save (Ctrl+S)">Save</button>
    <button class="btn" id="bsaveas">Save as</button>
  </div>
  <div class="grp">
    <button class="btn" id="bundo" title="Undo (Ctrl+Z)">Undo</button>
    <button class="btn" id="bredo" title="Redo (Ctrl+Y)">Redo</button>
  </div>
  <div class="grp">
    <button class="btn" id="bpng" title="Download the diagram as a PNG image">Export PNG</button>
    <button class="btn" id="bsvg" title="Download the diagram as an SVG image">Export SVG</button>
  </div>
  <button class="btn" id="bcode" title="Show or hide the Mermaid code">Hide code</button>
</header>
<main id="work">
  <section id="code" aria-label="Mermaid code">
    <div id="edwrap"><div id="gutter" aria-hidden="true"></div><textarea id="src" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Mermaid code"></textarea></div>
    <div id="status"></div>
  </section>
  <div id="split" role="separator" aria-orientation="vertical"></div>
  <section id="canvas" aria-label="Diagram">
    <div id="sheet"></div>
    <div id="tools">
      <button class="btn" id="baddnode" title="Add a new box">Add node</button>
      <button class="btn" id="bgroup" title="Put the selected nodes in a group (Shift-click to select several)">Group selected</button>
    </div>
    <button class="handle" id="h1" title="Drag to another node to connect. Drop on empty space to add a connected node." aria-label="Connect from this node">+</button>
    <button class="handle" id="h2" title="Drag to another node to connect. Drop on empty space to add a connected node." aria-label="Connect from this node">+</button>
    <svg id="rubber"><line x1="0" y1="0" x2="0" y2="0"/></svg>
    <textarea id="inline" aria-label="Edit label"></textarea>
    <div id="note"></div>
    <div id="empty">Type Mermaid code on the left, or choose New to start from a template.</div>
    <div id="zoom">
      <button class="btn" id="zout" title="Zoom out">−</button>
      <button class="btn" id="zfit" title="Fit the diagram to the window">Fit</button>
      <button class="btn" id="zin" title="Zoom in">+</button>
    </div>
    <div id="toast" role="status"></div>
  </section>
  <aside id="insp" aria-label="Properties"></aside>
</main>
<input type="file" id="filein" accept=".mmd,.mermaid,.md,.txt,text/plain" hidden>

<script>/*__MERMAID_JS__*/</script>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) e.append(kid);
  return e;
};

/* ------------------------------------------------------------------ *
 * Templates
 * ------------------------------------------------------------------ */
const TEMPLATES = {
  "Flowchart": `flowchart TD
    start(["Start"])
    check{"Is it valid?"}
    work["Process the data"]
    fail["Show an error"]
    stop(["End"])
    start --> check
    check -->|"Yes"| work
    check -->|"No"| fail
    work --> stop
    fail --> stop
`,
  "Sequence diagram": `sequenceDiagram
    actor User
    participant App
    participant API as API Server
    User->>App: Tap "Sign in"
    App->>API: POST /login
    alt Password is correct
        API-->>App: 200 OK and token
    else Password is wrong
        API-->>App: 401 Unauthorized
    end
    App-->>User: Show result
`,
  "Class diagram": `classDiagram
    class Animal {
        +String name
        +speak() String
    }
    class Dog {
        +fetch() void
    }
    Animal <|-- Dog
`,
  "State diagram": `stateDiagram-v2
    [*] --> Idle
    Idle --> Running : start
    Running --> Paused : pause
    Paused --> Running : resume
    Running --> Idle : stop
    Idle --> [*]
`,
  "ER diagram": `erDiagram
    CUSTOMER ||--o{ ORDER : places
    ORDER ||--|{ ORDER_ITEM : contains
    CUSTOMER {
        int id PK
        string name
    }
    ORDER {
        int id PK
        date created_at
    }
    ORDER_ITEM {
        int quantity
    }
`,
  "Gantt chart": `gantt
    title Project plan
    dateFormat YYYY-MM-DD
    section Design
    Requirements :done, req, 2026-01-05, 7d
    Wireframes   :active, wire, after req, 8d
    section Build
    Backend      :back, after wire, 15d
    Testing      :test, after back, 7d
`,
  "Mind map": `mindmap
  root((Main topic))
    Branch one
      Detail A
      Detail B
    Branch two
      Detail C
`,
  "Pie chart": `pie showData
    title Tickets by category
    "Billing" : 40
    "Login" : 25
    "Bugs" : 20
    "Other" : 15
`,
};

/* ------------------------------------------------------------------ *
 * State
 * ------------------------------------------------------------------ */
const S = {
  text: "", saved: "", fileName: "untitled.mmd", handle: null,
  hist: [], hpos: -1,
  model: null, type: "", canEdit: false, whyNot: "",
  sel: [],                       // [{kind:'node'|'edge'|'sub', id}]
  view: { x: 40, y: 60, k: 1 }, size: { w: 0, h: 0 }, needFit: true,
  seq: 0, rid: 0, tidyWarned: false, pendingEdit: null, lastSvg: "",
};
const src = $("#src"), sheet = $("#sheet"), canvas = $("#canvas"), insp = $("#insp");

mermaid.initialize({ startOnLoad: false, securityLevel: "strict", suppressErrorRendering: true, logLevel: "fatal" });

/* ------------------------------------------------------------------ *
 * Label text: database form <-> source form <-> what the user types
 * ------------------------------------------------------------------ */
const tpl = document.createElement("template");
const htmlNorm = (s) => { tpl.innerHTML = s; return tpl.innerHTML; };

/** Text as mermaid's parser stores it -> text as it is written in a .mmd file (quotes left raw). */
function fromDb(t) {
  if (t == null) return "";
  let s = String(t);
  // The parser HTML-escapes & < >. Undo that where it means the same thing, so "x > 0 && y" stays readable.
  const all = s.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&");
  if (all !== s && htmlNorm(all) === s) s = all;
  else { const amp = s.replace(/&amp;/g, "&"); if (amp !== s && htmlNorm(amp) === s) s = amp; }
  return s.replace(/ﬂ°°(\d+)¶ß/g, "#$1;").replace(/ﬂ°(\w+)¶ß/g, "#$1;").replace(/#quot;/g, '"').replace(/<br\s*\/?>/gi, "<br/>");
}
/** Source form -> quoted Mermaid string. */
function quote(label, md) {
  const s = String(label).replace(/<[^<>]*>/g, (tag) => tag.replace(/"/g, "'")).replace(/"/g, "#quot;");
  return md ? '"`' + s.replace(/`/g, "'") + '`"' : '"' + s + '"';
}
const toEdit = (label, md) => (md ? label : label.replace(/<br\/>/g, "\n"));
const fromEdit = (v, md) => { v = v.replace(/\r/g, "").trim(); return md ? v : v.replace(/\n/g, "<br/>"); };

/* ------------------------------------------------------------------ *
 * Flowchart model: built from mermaid's own parser, written back as tidy Mermaid
 * ------------------------------------------------------------------ */
const SHAPES = {
  square: ["[", "]"], round: ["(", ")"], stadium: ["([", "])"], subroutine: ["[[", "]]"], cylinder: ["[(", ")]"],
  circle: ["((", "))"], doublecircle: ["(((", ")))"], diamond: ["{", "}"], hexagon: ["{{", "}}"], odd: [">", "]"],
  lean_right: ["[/", "/]"], lean_left: ["[\\", "\\]"], trapezoid: ["[/", "\\]"], inv_trapezoid: ["[\\", "/]"],
};
const SHAPE_UI = [
  ["square", "Rectangle", '<rect x="3" y="3" width="26" height="14"/>'],
  ["round", "Rounded", '<rect x="3" y="3" width="26" height="14" rx="4"/>'],
  ["stadium", "Pill (start / end)", '<rect x="3" y="3" width="26" height="14" rx="7"/>'],
  ["diamond", "Decision", '<polygon points="16,2 29,10 16,18 3,10"/>'],
  ["circle", "Circle", '<circle cx="16" cy="10" r="7.5"/>'],
  ["cylinder", "Database", '<path d="M5 6a11 3 0 0 0 22 0a11 3 0 0 0-22 0v8a11 3 0 0 0 22 0v-8"/>'],
  ["hexagon", "Hexagon", '<polygon points="8,3 24,3 29,10 24,17 8,17 3,10"/>'],
  ["subroutine", "Subroutine", '<rect x="3" y="3" width="26" height="14"/><path d="M7 3v14M25 3v14"/>'],
  ["lean_right", "Input / output", '<polygon points="8,3 29,3 24,17 3,17"/>'],
  ["lean_left", "Input / output (reversed)", '<polygon points="3,3 24,3 29,17 8,17"/>'],
  ["trapezoid", "Trapezoid", '<polygon points="9,3 23,3 29,17 3,17"/>'],
  ["inv_trapezoid", "Inverted trapezoid", '<polygon points="3,3 29,3 23,17 9,17"/>'],
  ["doublecircle", "Double circle", '<circle cx="16" cy="10" r="8"/><circle cx="16" cy="10" r="5.5"/>'],
  ["odd", "Flag", '<polygon points="3,3 29,3 29,17 3,17 8,10"/>'],
];
const normDir = (d) => (d === "TD" ? "TB" : d || "TB");
const clone = (m) => JSON.parse(JSON.stringify(m));

function buildModel(text, db) {
  const lines = text.replace(/\r\n?/g, "\n").split("\n");
  let i = 0;
  if (/^\s*---\s*$/.test(lines[0] || "")) {
    let j = 1;
    while (j < lines.length && !/^\s*---\s*$/.test(lines[j])) j++;
    i = j + 1;
  }
  let h = -1;
  for (let k = i; k < lines.length; k++) {
    if (/^\s*(flowchart(-elk)?|graph)\b/.test(lines[k])) { h = k; break; }
    if (/^\s*$/.test(lines[k]) || /^\s*%%/.test(lines[k])) continue;
    break;
  }
  if (h < 0) return null;
  const hm = lines[h].match(/^\s*(flowchart(?:-elk)?|graph)(?:[ \t]+(TB|TD|BT|RL|LR))?/);
  const after = lines.slice(h + 1);
  const subs = db.getSubGraphs().map((s) => ({
    id: s.id, title: fromDb(s.title ?? s.id), md: s.labelType === "markdown", dir: s.hasExplicitDir ? s.dir || "" : "",
    nodes: [...(s.nodes || [])], classes: [...(s.classes || [])], styles: [],
  }));
  const subIds = new Set(subs.map((s) => s.id));
  const nodes = [];
  for (const v of db.getVertices().values()) {
    if (subIds.has(v.id)) {   // "style group1 fill:..." is stored on a phantom vertex
      const s = subs.find((x) => x.id === v.id);
      s.styles = [...(v.styles || [])];
      for (const c of v.classes || []) if (c !== "clickable" && !s.classes.includes(c)) s.classes.push(c);
      continue;
    }
    const extra = {};
    for (const k of ["icon", "form", "pos", "img", "constraint", "assetWidth", "assetHeight"]) if (v[k] != null && v[k] !== "") extra[k] = v[k];
    nodes.push({
      id: v.id, label: fromDb(v.text ?? v.id), md: v.labelType === "markdown", shape: v.type || "",
      styles: [...(v.styles || [])], classes: (v.classes || []).filter((c) => c !== "clickable"), extra,
    });
  }
  const rawEdges = db.getEdges();
  const edges = rawEdges.map((e) => ({
    id: e.id, userId: !!e.isUserDefinedId, start: e.start, end: e.end, type: e.type || "arrow_point", stroke: e.stroke || "normal",
    length: e.length || 1, label: fromDb(e.text || ""), md: e.labelType === "markdown",
    style: (e.style || []).filter((s) => s !== "fill:none"), interpolate: e.interpolate || "",
  }));
  const classDefs = [...db.getClasses().values()].map((c) => ({ id: c.id, styles: [...(c.styles || [])] }));
  let accTitle = "", accDescr = "";
  try { accTitle = db.getAccTitle?.() || ""; accDescr = db.getAccDescription?.() || ""; } catch (_) {}
  return {
    pre: lines.slice(0, h).join("\n"), keyword: hm ? hm[1] : "flowchart", dir: (hm && hm[2]) || db.getDirection() || "TD",
    comments: after.filter((l) => /^\s*%%(?!\{)/.test(l)).map((l) => l.trim()),

 * ------------------------------------------------------------------ */

/* connector handles */

let inlineFor = null;

/* theme lives in the file, so the PNG converter and other tools see it too */

  const fm = S.text.match(/^\s*---\n([\s\S]*?)\n---/);

  if (!m) m = S.text.match(/%%\{[\s\S]*?["']?theme["']?\s*:\s*["']([\w-]+)["'][\s\S]*?\}%%/);
  return m ? m[1] : "default";
}

  let t = S.text;
  const init = /(%%\{[\s\S]*?["']?theme["']?\s*:\s*["'])([\w-]+)(["'][\s\S]*?\}%%)/;
  const fm = t.match(/^(\s*---\n)([\s\S]*?)(\n---[ \t]*\n?)/);
  if (init.test(t)) t = t.replace(init, "$1" + name + "$3");
  else if (fm && /^\s*theme:/m.test(fm[2])) t = t.replace(fm[0], fm[1] + fm[2].replace(/^(\s*theme:\s*).*$/m, "$1" + name) + fm[3]);
  else if (fm && /^config:\s*$/m.test(fm[2])) t = t.replace(fm[0], fm[1] + fm[2].replace(/^config:\s*$/m, "config:\n  theme: " + name) + fm[3]);
  else if (fm) t = t.replace(fm[0], fm[1] + fm[2] + "\nconfig:\n  theme: " + name + fm[3]);
  else if (name !== "default") t = "---\nconfig:\n  theme: " + name + "\n---\n" + t;

function download(blob, name) {
  const a = el("a", { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function saveFile(as) {
  const text = S.text;
  try {
    if (window.showSaveFilePicker) {
      if (as || !S.handle) S.handle = await showSaveFilePicker({ suggestedName: S.fileName, types: FILE_TYPES });
      const w = await S.handle.createWritable();
      await w.write(text); await w.close();
      S.fileName = S.handle.name;
      toast("Saved " + S.fileName);
    } else {
      if (as || S.fileName === "untitled.mmd") {
        const n = prompt("File name", S.fileName);
        if (!n) return;
        S.fileName = /\.\w+$/.test(n) ? n : n + ".mmd";
      }
      download(new Blob([text], { type: "text/plain" }), S.fileName);
      toast("Downloaded " + S.fileName);
    }
    S.saved = text; updateChrome();
  } catch (e) { if (e.name !== "AbortError") toast("Could not save: " + e.message, true); }
}
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", async (e) => {
  e.preventDefault();
  const item = e.dataTransfer.items && e.dataTransfer.items[0], f = e.dataTransfer.files[0];
  if (!f || !okToDiscard()) return;
  let handle = null;
  try { if (item && item.getAsFileSystemHandle) handle = await item.getAsFileSystemHandle(); } catch (_) {}
  const isMd = /\.(md|markdown|mdx)$/i.test(f.name);
  loadDoc(fromMarkdown(await f.text(), f.name), isMd ? f.name.replace(/\.\w+$/, ".mmd") : f.name, isMd ? null : handle);
});
window.addEventListener("beforeunload", (e) => { if (S.text !== S.saved) { e.preventDefault(); e.returnValue = ""; } });

/* ------------------------------------------------------------------ *
 * Export
 * ------------------------------------------------------------------ */
const baseName = () => S.fileName.replace(/\.\w+$/, "") || "diagram";
function cleanSvg(svgText) {
  const doc = new DOMParser().parseFromString(svgText, "text/html");
  const svg = doc.querySelector("svg");
  const vb = (svg.getAttribute("viewBox") || "0 0 100 100").split(/\s+/).map(Number);
  svg.setAttribute("width", vb[2]); svg.setAttribute("height", vb[3]);
  svg.style.maxWidth = "none";
  svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  return { text: new XMLSerializer().serializeToString(svg), w: vb[2], h: vb[3] };
}
function svgToPng(svgText, w, h, scale, bg) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      try {
        const pad = 16, c = document.createElement("canvas");
        c.width = Math.ceil((w + pad * 2) * scale); c.height = Math.ceil((h + pad * 2) * scale);
        const g = c.getContext("2d");
        g.fillStyle = bg; g.fillRect(0, 0, c.width, c.height);
        g.drawImage(img, pad * scale, pad * scale, w * scale, h * scale);
        c.toBlob((b) => (b ? resolve(b) : reject(new Error("empty image"))), "image/png");
      } catch (e) { reject(e); }
    };
    img.onerror = () => reject(new Error("the browser could not draw the diagram"));
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgText);
  });
}
async function exportPng() {
  if (!S.lastSvg) return toast("There is no diagram to export yet.", true);
  const bg = canvas.classList.contains("dark") ? "#1e1e1e" : "#ffffff";
  const first = cleanSvg(S.lastSvg);
  const scale = Math.min(2, 12000 / Math.max(first.w, first.h));
  try {
    download(await svgToPng(first.text, first.w, first.h, scale, bg), baseName() + ".png");
    toast("Downloaded " + baseName() + ".png");
  } catch (e) {
    try {   // some browsers refuse to rasterise HTML labels: draw again with plain SVG text
      const flat = await mermaid.render("mx" + ++S.rid, "%%{init: {\"flowchart\": {\"htmlLabels\": false}, \"htmlLabels\": false}}%%\n" + S.text);
      const c = cleanSvg(flat.svg);
      download(await svgToPng(c.text, c.w, c.h, scale, bg), baseName() + ".png");
      toast("Downloaded " + baseName() + ".png (plain-text labels)");
    } catch (e2) { toast("PNG export failed in this browser. Export SVG instead, or use mermaid2png.py.", true); }
  }
}
function exportSvg() {
  if (!S.lastSvg) return toast("There is no diagram to export yet.", true);
  download(new Blob([cleanSvg(S.lastSvg).text], { type: "image/svg+xml" }), baseName() + ".svg");
}

/* ------------------------------------------------------------------ *
 * Wiring
 * ------------------------------------------------------------------ */
let typeTimer, histTimer;
src.addEventListener("input", () => {
  S.text = src.value; updateChrome(); drawGutter();
  clearTimeout(typeTimer); typeTimer = setTimeout(() => setText(src.value, { fromEditor: true }), 220);
  clearTimeout(histTimer); histTimer = setTimeout(() => { pushHistory(src.value); updateChrome(); }, 600);
});
src.addEventListener("scroll", () => ($("#gutter").scrollTop = src.scrollTop));
src.addEventListener("keydown", (e) => {
  if (e.key === "Tab") { e.preventDefault(); document.execCommand("insertText", false, "    "); }
});
$("#bopen").onclick = openFile;
$("#bsave").onclick = () => saveFile(false);
$("#bsaveas").onclick = () => saveFile(true);
$("#bundo").onclick = undo; $("#bredo").onclick = redo;
$("#bpng").onclick = exportPng; $("#bsvg").onclick = exportSvg;
$("#baddnode").onclick = () => ops.addNode(S.sel.length === 1 && S.sel[0].kind === "sub" ? S.sel[0].id : "");
$("#bgroup").onclick = () => ops.group(S.sel.map((s) => s.id));
$("#bcode").onclick = () => { const hidden = $("#code").classList.toggle("hidden"); $("#bcode").textContent = hidden ? "Show code" : "Hide code"; placeHandles(); };
for (const [name, text] of Object.entries(TEMPLATES)) {
  $("#newlist").append(el("button", { onclick: () => { $("#newmenu").classList.remove("open"); if (okToDiscard()) loadDoc(text, "untitled.mmd", null); } }, name));
}
$("#bnew").onclick = (e) => { e.stopPropagation(); $("#newmenu").classList.toggle("open"); };
document.addEventListener("click", () => $("#newmenu").classList.remove("open"));

/* splitter */
(() => {
  const sp = $("#split"); let on = false;
  sp.addEventListener("pointerdown", (e) => { on = true; sp.classList.add("drag"); sp.setPointerCapture(e.pointerId); });
  sp.addEventListener("pointermove", (e) => { if (on) { $("#code").style.width = Math.max(180, Math.min(e.clientX, innerWidth - 420)) + "px"; placeHandles(); } });
  sp.addEventListener("pointerup", () => { on = false; sp.classList.remove("drag"); });
})();
window.addEventListener("resize", placeHandles);

document.addEventListener("keydown", (e) => {
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod && k === "s") { e.preventDefault(); saveFile(e.shiftKey); return; }
  if (mod && k === "o") { e.preventDefault(); openFile(); return; }
  if (mod && k === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === "y") { e.preventDefault(); redo(); return; }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (typing || mod) return;
  if (e.key === "Escape") { select(null); return; }
  if (!S.canEdit || (document.activeElement.tagName === "BUTTON" && (e.key === "Enter" || e.key === " "))) return;
  if ((e.key === "Delete" || e.key === "Backspace") && S.sel.length) { e.preventDefault(); ops.remove(S.sel); }
  else if ((e.key === "Enter" || e.key === "F2") && S.sel.length === 1) { e.preventDefault(); startInline(S.sel[0]); }
  else if (e.key === "Tab" && S.sel.length === 1 && S.sel[0].kind === "node") { e.preventDefault(); ops.addChild(S.sel[0].id); }
  else if (e.key === "0") fit();
});

/* start: restore the last draft, or open the flowchart template */
(() => {
  let draft = null;
  try { draft = JSON.parse(localStorage.getItem("mermaid-visual-editor") || "null"); } catch (_) {}
  if (draft && typeof draft.text === "string" && draft.text.trim()) { loadDoc(draft.text, draft.fileName || "untitled.mmd", null); S.saved = ""; updateChrome(); }
  else loadDoc(TEMPLATES["Flowchart"], "untitled.mmd", null);
})();
window.__editor = { S, ops, setText, serialize, buildModel, parseFlow, signature, refresh, select, startInline, finishInline, loadDoc, exportPng, cleanSvg, svgToPng, setTheme, currentTheme, undo, redo, fit };
</script>
